<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Demo 4: Live Password Strength Meter</title>
<style>
  /* CONCEPT: JavaScript + the DOM reacting to a form, live.
     The "input" event fires on EVERY keystroke. We read the value, score it,
     and write results back into the page. This is how real sites do it. */

  body {
    background: #0f1220;
    font-family: Arial, sans-serif;
    color: #eef;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 60px;
  }
  .box {
    background: #191d33;
    padding: 30px;
    border-radius: 14px;
    width: 100%;
    max-width: 380px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid #2a2f4d;
    background: #0f1220;
    color: white;
  }
  /* The meter bar. JS changes its width and color using element.style */
  .track { background: #262b4a; border-radius: 6px; height: 14px; margin-top: 14px; }
  .bar {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background: #ff5470;         /* JS overwrites this */
    transition: width 0.4s, background-color 0.4s;   /* CSS makes JS changes smooth! */
  }
  #message { margin-top: 10px; font-size: 14px; min-height: 20px; }
  ul { font-size: 12px; color: #99a; }
</style>
</head>
<body>
  <div class="box">
    <h2>Password Strength (live)</h2>
    <input type="password" id="pw" placeholder="Type a password...">
    <div class="track"><div class="bar" id="bar"></div></div>
    <p id="message"></p>
    <ul>
      <li>+1 point: 8+ characters, a number, an UPPERCASE letter, a symbol</li>
      <li>5 points = uncrackable-ish</li>
    </ul>
  </div>

  <script>
    // Grab elements ONCE and store them in variables (just like Python!)
    let pwInput = document.getElementById("pw");
    let bar = document.getElementById("bar");
    let message = document.getElementById("message");

    function scorePassword(pw) {
      let score = 0;
      if (pw.length >= 8) score++;                                  // .length works in JS too
      if (/[0-9]/.test(pw)) score++;        // regex: contains a digit
      if (/[A-Z]/.test(pw)) score++;        // regex: contains uppercase
      if (/[^A-Za-z0-9]/.test(pw)) score++; // regex: contains a symbol
      return score;
    }

    pwInput.addEventListener("input", function () {
      let score = scorePassword(pwInput.value);
      let colors  = ["#ff5470", "#ff5470", "#ffb347", "#ffe066", "#3ef07c"];
      let labels  = ["Type something...", "Weak", "Okay", "Good", "Strong", "Fortress \uD83C\uDFF0"];

      // Writing to element.style is how JS changes CSS at runtime
      bar.style.width = (score * 25) + "%";
      bar.style.backgroundColor = colors[score];
      message.textContent = "Score: " + score + "/5 \u2014 " + labels[score];

      // TRY CHANGING THIS: make a 16+ character password worth a bonus point.
      // Hint: add another if (pw.length >= 16) score++; — but cap the bar at 100%.
    });
  </script>

</html>
